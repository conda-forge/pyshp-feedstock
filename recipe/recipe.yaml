schema_version: 1

context:
  version: "3.1.5"

package:
  name: pyshp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyshp/pyshp-${{ version }}.tar.gz
  sha256: 80b642be725aed44a3e55888339f90a633d326f0bb93fb9600f1307e4f3d5410

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: shapefile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - hypothesis
    files:
      source:
        - .
    script:
      - pytest -k "not (test_reader_url or test_dbf_reader_writer_roundtrip or test_shapefile_reader_writer_roundtrip or test_dbf_Field_roundtrips)"

about:
  summary: Pure Python read/write support for ESRI Shapefile format
  license: MIT
  license_file: LICENSE.TXT
  homepage: https://pypi.org/project/pyshp/

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf
